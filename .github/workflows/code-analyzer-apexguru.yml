name: Test run-code-analyzer@v2 (ApexGuru)

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  pull-requests: write
  contents: read
  actions: read

jobs:
  code-analysis:
    runs-on: ubuntu-latest
    # Single job, two concerns, matching Salesforce's own documented pattern (run-code-analyzer
    # README "Example v2 Usage"): one analyzer run produces the full report (job summary +
    # artifact + PR review comment), then a separate step enforces a gate off its outputs.
    # The action itself never fails the workflow on violations by design (so it can still post
    # its summary/review) - the gate step is what actually blocks the merge.
    #
    # Gate is scoped to CHANGED FILES ONLY (README "Option 2: Quality gate on CHANGED files
    # only - useful for legacy codebases"). This repo intentionally contains 15+ pre-existing
    # High-severity antipatterns by design; a whole-repo gate would stay red forever regardless
    # of what a given PR does. Gating on changed files means: block NEW High/Critical problems a
    # PR introduces, don't punish it for inherited debt.
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Code Analyzer Plugin
        run: sf plugins install code-analyzer@latest

      - name: Authenticate to Salesforce org (DF26 demo org - safe, no runtime profile)
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: echo "$SFDX_AUTH_URL" | sf org login sfdx-url --set-default --sfdx-url-stdin

      - name: Run Code Analyzer (ApexGuru engine)
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-arguments: --workspace . --rule-selector apexguru --output-file sfca_results.html --output-file sfca_results.json
          results-artifact-name: code-analyzer-results
          github-token: ${{ github.token }}
        # This step auto-uploads the artifact above, posts the job summary, and (since a PR
        # triggered this run) posts a review comment with the total + changed-file counts.

      - name: Block merge on Critical/High ApexGuru violations in changed files
        if: |
          steps.run-code-analyzer.outputs.num-sev1-violations-in-changed-files > 0 ||
          steps.run-code-analyzer.outputs.num-sev2-violations-in-changed-files > 0
        run: |
          echo "::error::Blocking: this PR introduces ${{ steps.run-code-analyzer.outputs.num-sev1-violations-in-changed-files }} Critical and ${{ steps.run-code-analyzer.outputs.num-sev2-violations-in-changed-files }} High ApexGuru violation(s) in changed files. Fix or triage these before merging."
          exit 1
